name: Build BLUO CLIENT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BLUO_CLIENT_Project_Fresh.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q BLUO_CLIENT_Project_Fresh.zip -d source
          cd source/BLUO_CLIENT
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLUO-CLIENT-APK
          path: source/BLUO_CLIENT/app/build/outputs/apk/debug/*.apk
